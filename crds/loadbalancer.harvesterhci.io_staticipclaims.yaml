---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {}
  name: staticipclaims.loadbalancer.harvesterhci.io
spec:
  group: loadbalancer.harvesterhci.io
  names:
    kind: StaticIPClaim
    listKind: StaticIPClaimList
    plural: staticipclaims
    shortNames:
    - ipc
    - ipcs
    singular: staticipclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .status.allocatedIPv4
      name: IPv4
      type: string
    - jsonPath: .status.allocatedIPv6
      name: IPv6
      type: string
    - jsonPath: .spec.identifier
      name: Identifier
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              identifier:
                description: Unique secret token/identifier presented by the guest.
                  Immutable once created.
                maxLength: 128
                minLength: 8
                pattern: ^[a-zA-Z0-9\-_.]+$
                type: string
                x-kubernetes-validations:
                - message: spec.identifier is immutable
                  rule: self == oldSelf
              poolRef:
                description: |-
                  Reference to the target IPPool. Immutable once created.
                  The IP family strategy (IPv4, IPv6, or DualStack) is governed by the referenced pool.
                type: string
                x-kubernetes-validations:
                - message: spec.poolRef is immutable
                  rule: self == oldSelf
              targetIPv4:
                description: |-
                  Static IPv4 address requested by user. Optional on creation.
                  If empty and referenced pool supports IPv4, controller auto-allocates an IPv4 address.
                  Immutable once set by the user.
                format: ipv4
                type: string
                x-kubernetes-validations:
                - message: spec.targetIPv4 is immutable once set. Delete and recreate
                    to change IPs.
                  rule: self == oldSelf
              targetIPv6:
                description: |-
                  Static IPv6 address requested by user. Optional on creation.
                  If empty and referenced pool supports IPv6, controller auto-allocates an IPv6 address.
                  Immutable once set by the user.
                format: ipv6
                type: string
                x-kubernetes-validations:
                - message: spec.targetIPv6 is immutable once set. Delete and recreate
                    to change IPs.
                  rule: self == oldSelf
            required:
            - identifier
            - poolRef
            type: object
          status:
            properties:
              allocatedIPv4:
                description: Allocated IPv4 address from the pool (populated in Reserved/InUse
                  states).
                type: string
              allocatedIPv6:
                description: Allocated IPv6 address from the pool (populated in Reserved/InUse
                  states).
                type: string
              conditions:
                description: Standard Kubernetes conditions detailing programmatic
                  transition reasons.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              state:
                description: 'State represents the current lifecycle phase of the
                  claim: Unassigned | Reserved | InUse | Failed.'
                enum:
                - Unassigned
                - Reserved
                - InUse
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
